<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fff5f7" />
    <title>Ngoại tuyến | Mochi Film</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 25%, #fff 0, #fff5f7 42%, #ffe7ee 100%);
        color: #3f2933;
        font:
          16px/1.6 system-ui,
          sans-serif;
        text-align: center;
      }
      .card {
        width: min(90vw, 460px);
        padding: 42px 28px;
        border: 1px solid #ffd1dd;
        border-radius: 32px;
        background: #ffffffd9;
        box-shadow: 0 24px 70px #db277733;
      }
      .wordmark {
        width: min(230px, 65vw);
        height: auto;
      }
      .mascot {
        display: block;
        width: 118px;
        height: 118px;
        object-fit: contain;
        margin: 16px auto 4px;
      }
      h1 {
        margin: 8px 0 6px;
        font-size: 27px;
        color: #db2777;
      }
      p {
        margin: 0 auto 24px;
        max-width: 330px;
        color: #71515e;
      }
      button {
        min-height: 46px;
        padding: 0 25px;
        border: 0;
        border-radius: 999px;
        background: #ec4899;
        color: #fff;
        font:
          700 15px system-ui,
          sans-serif;
        cursor: pointer;
        box-shadow: 0 9px 24px #ec489966;
      }
      button:hover {
        background: #db2777;
      }
      button:focus-visible {
        outline: 3px solid #f9a8d4;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="wordmark" src="/assets/mochi/wordmark.webp" alt="Mochi Film" />
      <img class="mascot" src="/assets/mochi/mascot-mini.png" alt="" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Mochi chưa thể kết nối mạng. Hãy thử lại khi đường truyền ổn định nhé.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
