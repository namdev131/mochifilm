<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fff5f7" />
    <title>Ngoại tuyến | Mochi Film</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 25%, #fff 0, #fff5f7 42%, #ffe7ee 100%);
        color: #3f2933;
        font:
          16px/1.6 system-ui,
          sans-serif;
        text-align: center;
      }
      .card {
        width: min(90vw, 460px);
        padding: 42px 28px;
        border: 1px solid #ffd1dd;
        border-radius: 32px;
        background: #ffffffd9;
        box-shadow: 0 24px 70px #db277733;
      }
      .wordmark {
        width: min(230px, 65vw);
        height: auto;
      }
      .mascot {
        display: block;
        width: 168px;
        height: 182px;
        object-fit: contain;
        margin: 16px auto 4px;
        filter: drop-shadow(0 12px 20px #dc4b821f);
      }
      h1 {
        margin: 8px 0 6px;
        font-size: 27px;
        color: #db2777;
      }
      p {
        margin: 0 auto 24px;
        max-width: 330px;
        color: #71515e;
      }
      button {
        min-height: 46px;
        padding: 0 25px;
        border: 0;
        border-radius: 999px;
        background: #ec4899;
        color: #fff;
        font:
          700 15px system-ui,
          sans-serif;
        cursor: pointer;
        box-shadow: 0 9px 24px #ec489966;
      }
      button:hover {
        background: #db2777;
      }
      button:focus-visible {
        outline: 3px solid #f9a8d4;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="wordmark" src="/assets/mochi/wordmark.webp" alt="Mochi Film" />
      <canvas
        class="mascot"
        id="sadMochiCanvas"
        width="384"
        height="416"
        role="img"
        aria-label="Mochi hơi buồn vì mất kết nối mạng"
      ></canvas>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Mochi chưa thể kết nối mạng. Hãy thử lại khi đường truyền ổn định nhé.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
    <script>
      (() => {
        const canvas = document.getElementById("sadMochiCanvas");
        const context = canvas.getContext("2d");
        const atlas = new Image();
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let frame = 0;
        let last = 0;
        let animation = 0;

        const draw = (now = 0) => {
          if (!last) last = now;
          if (!reducedMotion && now - last >= 1000 / 6) {
            frame = (frame + 1) % 8;
            last = now;
          }
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.drawImage(atlas, frame * 192, 5 * 208, 192, 208, 0, 0, 384, 416);
          if (!reducedMotion) animation = requestAnimationFrame(draw);
        };

        atlas.addEventListener("load", () => draw(), { once: true });
        atlas.src = "/assets/mochi/loading-atlas.png";
        document.addEventListener("visibilitychange", () => {
          cancelAnimationFrame(animation);
          if (!document.hidden && !reducedMotion) animation = requestAnimationFrame(draw);
        });
      })();
    </script>
  </body>
</html>
